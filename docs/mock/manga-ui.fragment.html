<script>
(() => {
const root=document.getElementById('manga-design'), product=root.querySelector('.product'), content=root.querySelector('#manga-content'), picker=root.querySelector('#manga-page');
const pages=[['library','漫画库'],['continue','继续阅读'],['favorites','收藏'],['stars','星标'],['images','收藏图片'],['authors','作者'],['author','作者详情'],['series','Series'],['seriesDetail','Series 详情'],['work','漫画详情'],['chapter','章节与语言版本'],['edit','编辑资料'],['reader','阅读器'],['thumbnails','页面总览与排序'],['tags','标签管理'],['tagDetail','标签详情'],['history','阅读历史'],['statistics','阅读统计'],['downloads','下载管理'],['storage','存储位置'],['smb','添加 SMB'],['import','导入与识别'],['pending','待提交整理'],['conflict','解决冲突'],['result','提交结果'],['settings','设置与同步'],['management','管理中心']];
pages.splice(13,0,['pdfReader','PDF 阅读器']);
const items=[{name:'雨の帰り道',cn:'雨中归途',author:'青井遥',art:0,sub:'AFTER THE RAIN',lang:'日本語 · English',progress:62,tag:'日常',chapters:8},{name:'海辺の手紙',cn:'海边来信',author:'白石凪',art:1,sub:'LETTERS FROM THE SEA',lang:'日本語',progress:0,tag:'治愈',chapters:3},{name:'夜を歩く',cn:'夜行记',author:'水野澄',art:2,sub:'A WALK IN THE NIGHT',lang:'中文 · 日本語',progress:100,tag:'奇幻',chapters:5},{name:'喫茶 星の庭',cn:'星庭咖啡',author:'青井遥',art:3,sub:'GARDEN OF STARS',lang:'English',progress:20,tag:'日常',chapters:4},{name:'遠い日の青',cn:'遥远的蓝',author:'白石凪',art:4,sub:'DISTANT BLUE',lang:'日本語',progress:0,tag:'治愈',chapters:2},{name:'春を待つ',cn:'等待春天',author:'水野澄',art:5,sub:'WAITING FOR SPRING',lang:'中文',progress:0,tag:'日常',chapters:6}];
let state={page:'library',device:'mac',filter:'全部',query:'',nsfw:false,lang:'ja',star:false,fav:true,imageStar:false,imageFav:false,current:8,zoom:100,description:true,pending:4,committed:false,downloaded:false,historyCleared:false,downloadPaused:false};
const saved=window.openai?.widgetState?.privateContent;if(saved&&pages.some(p=>p[0]===saved.page))state={...state,...saved};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(text,route,cls='')=>`<button type="button" class="${cls}" data-route="${route}">${text}</button>`;
const action=(text,name,cls='')=>`<button type="button" class="${cls}" data-action="${name}">${text}</button>`;
const head=(title,subtitle='',actions='')=>`<div class="page-head"><div><h1>${title}</h1>${subtitle?`<p>${subtitle}</p>`:''}</div>${actions?`<div class="head-actions">${actions}</div>`:''}</div>`;
const cover=(it,mini=false)=>`<div class="cover ${mini?'mini-cover':''}" data-art="${it.art}" role="img" aria-label="${it.cn}，示意封面"><span class="cover-title">${it.name}</span><span class="cover-sub">${it.sub}</span>${!mini?`<span class="cover-badge">${it.progress===100?'已读':it.progress>0?'阅读中':'未读'}</span>`:''}</div>`;
const card=(it)=>`<article class="manga-card"><button type="button" data-route="work">${cover(it)}<h3>${it.cn}</h3><p>${it.author} · ${it.chapters} 章</p>${it.progress>0?`<div class="mini-progress"><span style="width:${it.progress}%"></span></div>`:''}</button></article>`;
const cards=(arr=items)=>`<div class="cover-grid">${arr.map(card).join('')}</div>`;
const notice=t=>`<div class="notice">${icon('info')}<span>${t}</span></div>`;
const field=(label,value,full=false)=>`<label class="field ${full?'full':''}"><span>${label}</span><input value="${escape(value)}"></label>`;
const section=(title,body)=>`<div class="form-section"><h2>${title}</h2>${body}</div>`;
const row=(title,desc,tail='',lead='')=>`<div class="list-row">${lead}<div class="row-body"><h3>${title}</h3>${desc?`<p>${desc}</p>`:''}</div>${tail}</div>`;
const toggle=(title,desc,checked,attr='')=>`<label class="toggle-row"><span><h3>${title}</h3><p>${desc}</p></span><input class="switch" type="checkbox" ${checked?'checked':''} ${attr}></label>`;
const paper=(n=state.current)=>`<div class="page-paper" role="img" aria-label="第 ${n} 页，漫画分镜示意"><div class="panel-scene"><span class="bubble">${n%2?'雨、やんだね。':'もう少し、歩こう。'}</span></div><div class="panel-scene"></div><div class="panel-scene"><span class="bubble">また明日。</span></div></div>`;
const chapters=()=>`<div class="list">${[1,2,3,4].map((n)=>row(`第 ${n} 章 · ${['初夏的雨','车站旁','另一条路','雨后'][n-1]}`,`${n===1?'日本語 · English':'日本語'} · ${n===3?'PDF · 36 页':'24 页'}`,`${n===2?'<span class="badge rose">8 / 24 页</span>':n===1?'<span class="badge green">已读</span>':'<span class="badge">未读</span>'}${btn(icon('chevron-right'),'chapter')}`,cover(items[0],true))).join('')}</div>`;
const filterBar=()=>`<div class="filter-row"><label class="search">${icon('search')}<input id="library-search" placeholder="搜索漫画、作者、标签" value="${escape(state.query)}" aria-label="搜索漫画库"></label><select id="sort-order" aria-label="排序"><option>最近添加</option><option>最近阅读</option><option>名称</option><option>作者</option></select>${action(icon('sliders-horizontal')+' 筛选','filters')}</div><div class="chips">${['全部','未读','日常','治愈','奇幻'].map(t=>`<button type="button" data-filter="${t}" class="${state.filter===t?'selected':''}">${t}</button>`).join('')}</div>`;
const starFav=()=>`${action(icon('heart')+(state.fav?'已收藏':'收藏'),'favorite',state.fav?'selected':'soft')}${action(icon('star')+(state.star?'已星标':'星标'),'star',state.star?'selected':'soft')}`;
const renderPage={
library:()=>head('漫画库','你的故事，都在这里。',action(icon('layout-grid'),'grid','selected')+action(icon('list'),'list'))+filterBar()+`<div id="filtered-books">${filteredCards()}</div>`,
continue:()=>head('继续阅读','从上一次停下的地方开始。')+`<div class="split-detail">${cover(items[0])}<div class="detail-copy"><span class="badge rose">最近阅读 · 今天 10:42</span><h1 style="margin-top:12px">雨中归途</h1><p>第 2 章 · 车站旁<br>日本語 · 第 8 / 24 页</p><div class="mini-progress"><span style="width:33%"></span></div><div class="inline-actions">${btn(icon('book-open')+' 继续阅读','reader','primary')}${btn('章节详情','chapter','soft')}</div></div></div><div class="section-title"><h2>其他正在阅读</h2></div>${cards([items[3]])}`,
favorites:()=>head('收藏','作品、章节与喜欢的单页。',btn('收藏图片','images','soft'))+`<div class="chips">${btn('全部','favorites','selected')}${btn('漫画','favorites')}${btn('章节','chapter')}${btn('图片','images')}</div>${cards([items[0],items[1],items[4]])}`,

let swipe=null,swipeBusy=false,wheelDistance=0,wheelTimer;
function isReader(){return ['reader','pdfReader'].includes(state.page);}
function settlePage(delta){if(swipeBusy)return;const limit=state.page==='pdfReader'?36:24;if(state.current+delta<1||state.current+delta>limit){render();return;}const art=content.querySelector('.reader-art');swipeBusy=true;if(art&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){art.animate([{transform:art.style.transform||'translateX(0)'},{transform:'translateX('+(-delta*100)+'%)'}],{duration:210,easing:'cubic-bezier(.2,.8,.2,1)'}).finished.catch(()=>{}).then(()=>{state.current+=delta;render();swipeBusy=false;save();});}else{state.current+=delta;render();swipeBusy=false;save();}}
root.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,textarea,select,[draggable]')||!root.querySelector('#manga-modal').hidden)return;if(e.pointerType==='mouse'&&e.button!==0)return;swipe={x:e.clientX,y:e.clientY,started:Date.now(),id:e.pointerId,reader:isReader()};if(swipe.reader&&state.zoom===100)content.querySelector('.full-reader')?.setPointerCapture(e.pointerId);});
root.addEventListener('pointermove',e=>{if(!swipe||swipe.id!==e.pointerId)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(swipe.reader&&state.zoom===100&&Math.abs(dx)>Math.abs(dy)){const art=content.querySelector('.reader-art');if(art)art.style.transform='translateX('+dx+'px)';const edge=content.querySelector(dx<0?'.reader-edge.right':'.reader-edge.left');if(edge)edge.classList.toggle('visible',Math.abs(dx)>25);}});
root.addEventListener('pointerup',e=>{if(!swipe||e.pointerId!==swipe.id)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y,reader=swipe.reader;swipe=null;if(reader&&state.zoom===100){if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){settlePage(dx<0?1:-1);}else if(dy>95&&Math.abs(dy)>Math.abs(dx)){actions.back();}else render();}else if(!reader&&Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)){if(dx>0)actions.back();else actions.forward();}});
 root.addEventListener('pointercancel',()=>{swipe=null;if(isReader())render();});
root.addEventListener('wheel',e=>{if(e.target.closest('input,textarea,select')||!root.querySelector('#manga-modal').hidden||Math.abs(e.deltaX)<Math.abs(e.deltaY)||Math.abs(e.deltaX)<2||e.ctrlKey)return;if(isReader()&&state.zoom!==100)return;e.preventDefault();wheelDistance+=e.deltaX;clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{const dx=wheelDistance;wheelDistance=0;if(Math.abs(dx)<35)return;if(isReader())settlePage(dx>0?1:-1);else if(dx>0)actions.forward();else actions.back();},110);},{passive:false});
const renderV3=render;
render=function(){renderV3();if(isReader()){const art=content.querySelector('.reader-art');art.style.position='relative';const limit=state.page==='pdfReader'?36:24;for(const delta of [-1,1]){const n=state.current+delta;if(n<1||n>limit)continue;const localPaper=paper(n).replaceAll('もう少し、歩こう。',currentLanguage()==='zh'?'再走一会儿吧。':currentLanguage()==='en'?'Let’s walk a little longer.':'もう少し、歩こう。').replaceAll('雨、やんだね。',currentLanguage()==='zh'?'雨停了呢。':currentLanguage()==='en'?'The rain has stopped.':'雨、やんだね。').replaceAll('また明日。',currentLanguage()==='zh'?'明天见。':currentLanguage()==='en'?'See you tomorrow.':'また明日。');art.insertAdjacentHTML('beforeend',`<div class="photo-neighbor" style="position:absolute;top:0;left:${delta*100}%;width:100%;height:100%;display:flex;align-items:center;justify-content:center" aria-hidden="true">${localPaper}</div>`);}}};

function tagPicker(key,initial=''){if(!tagSelections[key])tagSelections[key]=initial.split(/[，,]/).map(s=>s.trim()).filter(Boolean);const selected=tagSelections[key],query=state.tagQuery[key]||'';return `<div class="token-input-wrap" data-tag-key="${escape(key)}"><div class="token-input">${selected.map(t=>`<span class="tag-token">${escape(t)}<button type="button" data-remove-tag="${escape(t)}" data-tag-owner="${escape(key)}" aria-label="移除 ${escape(t)}">${icon('x')}</button></span>`).join('')}<input data-tag-search="${escape(key)}" value="${escape(query)}" placeholder="搜索或创建标签" aria-label="搜索标签"></div><div class="tag-menu" ${state.tagMenu===key?'':'hidden'}>${tagMenuMarkup(key)}</div></div>`;}

 if(state.page==='tags'){content.innerHTML=head('标签','按标签浏览漫画。')+`<div class="list">${tagCatalog.map(t=>row(t,'',btn(icon('chevron-right'),'tagDetail'),'<span class="tag-dot"></span>')).join('')}</div>`;}

 if(state.page==='settings'){content.innerHTML=head('阅读设置','浏览、离线阅读与自动同步。')+`<div class="list">${row('阅读与语言','默认语言、显示方式和内容可见性。',btn(icon('chevron-right'),'settingsReading'),icon('book-open'))}${row('连接','SMB 媒体与资料同步服务。',btn(icon('chevron-right'),'settingsConnections'),icon('server'))}${row('同步','收藏、星标与阅读进度。',btn(icon('chevron-right'),'settingsSync'),icon('cloud-check'))}${row('下载','离线副本与本地空间。',btn(icon('chevron-right'),'downloads'),icon('download'))}</div>`;}
 if(state.page.startsWith('settings')&&state.page!=='settings'){content.querySelectorAll('.chips button').forEach(b=>{if(!phonePages.has(b.dataset.route))b.remove();});}
 hydrate();
};
const smbMac=renderPage.smb;
renderPage.smb=()=>state.device==='mac'?smbMac():head('连接 SMB','从 NAS 浏览与阅读漫画。')+`<div class="meta-grid">${field('连接名称','家中的 NAS')}${field('服务器','nas.local')}${field('共享名称','Manga')}${field('用户名','reader')}<label class="field full"><span>密码</span><input type="password" autocomplete="off" placeholder="输入密码"></label></div><div class="footer-actions">${action('测试连接','phoneTestSmb','soft')}${action('保存并连接','phoneConnectSmb','primary')}</div>`;
actions.phoneTestSmb=()=>toast('读取连接测试示意 · 尚未访问实际 NAS');actions.phoneConnectSmb=()=>{route('settingsConnections');toast('阅读连接已保存（预览）');};
const settingsReadMac=renderPage.settingsReading;
renderPage.settingsReading=()=>settingsReadMac()+(state.device==='phone'?section('内容显示',`<div class="list">${toggle('显示 NSFW 内容','关闭时在浏览、收藏、历史与下载中隐藏。',state.nsfw,'data-nsfw-toggle')}</div>`):'');
// UIKit / Apple Music direction: large navigation titles and floating bottom chrome.
const musicPhoneRender=render;
render=function(){musicPhoneRender();if(state.device!=='phone')return;
 let status=product.querySelector('.ios-status');if(!status){status=document.createElement('div');status.className='ios-status';status.innerHTML=`<span>9:41</span><span class="status-icons">${icon('signal')}${icon('wifi')}${icon('battery')}</span>`;product.prepend(status);}
 let mini=product.querySelector('.ios-mini-reader');if(!mini){mini=document.createElement('div');mini.className='ios-mini-reader';product.append(mini);}mini.innerHTML=`${cover(items[0],true)}<button type="button" class="mini-reader-copy" data-route="reader"><h3>雨中归途 · 第 2 章</h3><small>继续阅读 · 第 ${state.current} 页</small></button>${btn(icon('book-open'),'reader')}`;mini.querySelector('button:last-child').setAttribute('aria-label','继续阅读');
 let home=product.querySelector('.ios-home-indicator');if(!home){home=document.createElement('div');home.className='ios-home-indicator';home.setAttribute('aria-hidden','true');product.append(home);}
 if(product.dataset.reading==='true'){hydrate();return;}
 product.dataset.scrolled='false';const top=root.querySelector('.single-titlebar');top.innerHTML=`<div class="titlebar-navigation">${action(icon('chevron-left'),'back','ios-back')}</div><span class="ios-compact-title">${pages.find(p=>p[0]===state.page)?.[1]||'漫画库'}</span><div class="ios-bar-actions">${action(icon('list-filter'),'phoneBrowseMenu')}${action(icon('ellipsis'),'phoneMoreMenu')}</div>`;top.querySelector('[data-action="back"]').setAttribute('aria-label','返回');top.querySelector('[data-action="phoneBrowseMenu"]').setAttribute('aria-label','排序与筛选');top.querySelector('[data-action="phoneMoreMenu"]').setAttribute('aria-label','更多');
 const pageHead=content.querySelector('.page-head');if(pageHead&&!state.page.startsWith('settings')&&state.page!=='smb'&&state.page!=='thumbnails'){const existing=content.querySelector('.filter-row .search');if(existing)existing.closest('.filter-row').remove();pageHead.insertAdjacentHTML('afterend',`<label class="ios-search">${icon('search')}<input id="global-search" placeholder="${state.page==='work'?'在漫画中搜索':'搜索漫画库'}" aria-label="搜索漫画库">${icon('mic')}</label>`);}
 if(['library','work','series'].includes(state.page)){const search=content.querySelector('.ios-search');search?.insertAdjacentHTML('afterend',`<div class="ios-browse-actions">${btn(icon('book-open')+' 继续阅读','reader')}${state.page==='work'?action(icon('download')+' 下载漫画','downloadWork'):btn(icon('heart')+' 收藏','favorites')}</div>`);}
 if(state.page==='work')content.querySelector('.page-head .head-actions')?.remove();
 const tabs=root.querySelector('.phone-tabs');const tab=[['library','library','漫画库'],['continue','book-open','继续阅读'],['downloads','download','下载']];const active=['continue','downloads'].includes(state.page)?state.page:'library';tabs.innerHTML=tab.map(([key,ic,title])=>`<button type="button" data-route="${key}" class="${key===active?'selected':''}">${icon(ic)}<span>${title}</span></button>`).join('');
 content.querySelectorAll('.shelf-edit').forEach(el=>el.remove());hydrate();};
actions.phoneBrowseMenu=()=>modal('排序与筛选',`<div class="list">${row('排序','','<select aria-label="排序方式"><option>名称</option><option>最近添加</option><option>最近阅读</option></select>')}${row('阅读状态','','<select aria-label="阅读状态"><option>全部</option><option>未读</option><option>阅读中</option></select>')}</div>`,action('完成','close','primary'));
actions.phoneMoreMenu=()=>modal('漫画库',`${state.page==='work'?`<div class="inline-actions" style="margin:0 0 14px">${starFav()}</div>`:''}<div class="list">${row('收藏','',btn('查看','favorites'),icon('heart'))}${row('作者','',btn('查看','authors'),icon('users'))}${row('Series','',btn('查看','series'),icon('layers'))}${row('标签','',btn('查看','tags'),icon('tags'))}${row('阅读历史','',btn('查看','history'),icon('history'))}${row('阅读设置','',btn('查看','settings'),icon('settings'))}</div>`);
content.addEventListener('scroll',()=>{if(state.device==='phone')product.dataset.scrolled=String(content.scrollTop>70);},{passive:true});
root.addEventListener('click',e=>{if(state.device==='phone'&&product.dataset.scrolled==='true'&&e.target.closest('.phone-tabs')){product.dataset.scrolled='false';e.preventDefault();e.stopPropagation();}},true);
const phoneRoute=route;route=function(destination){const previous=state.page;phoneRoute(destination);if(state.device==='phone'&&previous!==state.page&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const goingBack=future.includes(previous);content.animate([{transform:'translateX('+(goingBack?'-18':'18')+'px)',opacity:.6},{transform:'translateX(0)',opacity:1}],{duration:250,easing:'cubic-bezier(.2,.8,.2,1)'});}content.scrollTop=0;};
picker.innerHTML=pages.map(([k,t])=>`<option value="${k}">${t}</option>`).join('');
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.chapterIndex)state.chapterIndex=Number(b.dataset.chapterIndex);if(b.dataset.device){state.device=b.dataset.device;render();save();return;}if(b.dataset.route){route(b.dataset.route);return;}if(b.dataset.filter){state.filter=b.dataset.filter;render();return;}if(b.dataset.language){state.lang=b.dataset.language;render();return;}if(b.dataset.openPage){state.current=Number(b.dataset.openPage);route('reader');return;}if(b.dataset.action&&actions[b.dataset.action]){actions[b.dataset.action](e.target);save();}});
root.addEventListener('change',e=>{if(e.target===picker)route(picker.value);if(e.target.matches('[data-nsfw-toggle]')){state.nsfw=e.target.checked;if(root.querySelector('#manga-modal').hidden)render();save();}if(e.target.id==='description-language'){state.lang=e.target.value;render();}if(e.target.matches('[data-nsfw-edit]'))toast(e.target.checked?'NSFW 标签已添加 · 此章节将隐藏':'NSFW 标签已移除');if(e.target.id==='stats-range'){let vals=e.target.value==='本周'?['3.8','186','7']:e.target.value==='本月'?['12.6','620','21']:['28.4','1,402','48'];['stat-time','stat-pages','stat-chapters'].forEach((id,i)=>root.querySelector('#'+id).textContent=vals[i]+(i===0?' 小时':''));}if(e.target.id==='sort-order'){const arr=[...items].sort((a,b)=>e.target.value==='名称'?a.cn.localeCompare(b.cn,'zh'):e.target.value==='作者'?a.author.localeCompare(b.author,'zh'):b.progress-a.progress);root.querySelector('#filtered-books').innerHTML=cards(arr);hydrate();}});
root.addEventListener('input',e=>{if(e.target.id==='library-search'){state.query=e.target.value;root.querySelector('#filtered-books').innerHTML=filteredCards();hydrate();}});
root.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(state.page==='reader'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){if(e.key==='ArrowRight')actions.nextPage();if(e.key==='ArrowLeft')actions.prevPage();}});
let dragged;root.addEventListener('dragstart',e=>{dragged=e.target.closest('[draggable]');});root.addEventListener('dragover',e=>{if(e.target.closest('[draggable]'))e.preventDefault();});root.addEventListener('drop',e=>{const target=e.target.closest('[draggable]');if(target&&dragged&&target!==dragged){e.preventDefault();target.before(dragged);toast('阅读顺序已自动保存（预览）');}});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&pages.some(p=>p[0]===s.page)){state={...state,...s};render();}});
render();
if(globalThis.Tweak){const design={density:'舒展',showDescription:true};const tweak=new Tweak({container:product,onChange:()=>{state.description=design.showDescription;root.style.setProperty('--design-gap',design.density==='紧凑'?'12px':'22px');const grids=root.querySelectorAll('.cover-grid');grids.forEach(g=>g.style.gap=design.density==='紧凑'?'14px 12px':'22px 17px');if(state.page==='reader')render();}});tweak.addSelect(design,'density',{label:'封面网格密度',options:['舒展','紧凑']});tweak.addToggle(design,'showDescription',{label:'阅读器显示描述'});}
})();
</script>
